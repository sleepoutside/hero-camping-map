name: 更新氣象署鄉鎮預報
on:
  schedule:
    - cron: "50 21,3,9,15 * * *"   # 台灣時間 05:50、11:50、17:50、23:50（氣象署每天 5:30、11:30、17:30、23:30 發布）
  workflow_dispatch:
permissions:
  contents: write
concurrency: cwa
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取預報
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python3 tools/cwa_fetch.py
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cwa.json
          git diff --cached --quiet || (git commit -m "更新氣象署鄉鎮預報" && git pull --rebase && git push)
